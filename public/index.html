<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S&amp;P 500 성장 종목 발굴 대시보드</title>
  <meta name="description" content="S&P500 전 종목의 재무 지표를 점수화해 순위를 매기는 대시보드" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #0B1220; }
    #root { min-height: 100vh; }
    .boot {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #8B96AC; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px;
    }
    .boot-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #C9A227;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.3); } }

    * { box-sizing: border-box; }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #31415E; border-radius: 4px; }

    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 10px 12px; white-space: nowrap; }
    thead th { position: sticky; top: 0; z-index: 1; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #182338; }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid #C9A227; outline-offset: 2px;
    }

    @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .ticker-track { animation: ticker-scroll 38s linear infinite; }
    .ticker-track:hover { animation-play-state: paused; }

    @media (prefers-reduced-motion: reduce) {
      .boot-dot { animation: none; opacity: 1; }
      .ticker-track { animation: none; }
    }
  </style>

  <!-- 라이브러리는 esm.sh CDN에서 직접 불러옵니다 (빌드 단계 불필요) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-dot"></div>
      <div>대시보드를 불러오는 중…</div>
    </div>
  </div>

  <!-- 브라우저에서 JSX를 변환합니다. 별도 빌드 없이 동작합니다. -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="./dashboard.jsx"></script>

  <script>
    // 5초 안에 앱이 붙지 않으면 안내 문구를 보여줍니다.
    setTimeout(function () {
      var boot = document.querySelector('.boot');
      if (boot) {
        boot.innerHTML =
          '<div style="max-width:420px;text-align:center;line-height:1.7">' +
          '화면이 계속 비어 있다면 브라우저 콘솔(F12)에서 오류를 확인해주세요.<br>' +
          '사내망·광고차단기가 CDN(esm.sh, unpkg.com) 접속을 막고 있을 수 있습니다.' +
          '</div>';
      }
    }, 8000);
  </script>
</body>
</html>
