name: Daily S&P500 Update

on:
  # 매일 UTC 22:00 = 한국시간 오전 7시 (미국장 마감 후)
  schedule:
    - cron: "0 22 * * 1-5"
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: write   # sp500_metrics.json 커밋용
  pages: write      # Pages 배포용
  id-token: write

# 동시 실행 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: S&P500 데이터 수집
        run: python scripts/sp500_collector.py

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "sp500-bot"
          git config user.email "sp500-bot@users.noreply.github.com"
          git add public/sp500_metrics.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음 - 커밋 건너뜀"
          else
            git commit -m "chore: S&P500 데이터 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: public 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
